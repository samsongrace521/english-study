name: Daily news and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'   # 06:30 Taiwan time
  workflow_dispatch:
    inputs:
      force:
        description: "重新挑選今天的新聞"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick today's news
        if: github.event_name != 'push'
        run: node scripts/fetch-news.js ${{ inputs.force && '--force' || '' }}
      - name: Save news archive
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet data/news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "每日新聞 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
