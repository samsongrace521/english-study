<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多益千字六十天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: one study column like a vocab notebook — sticky header with progress, tabbed views, a focused "stage" for each session. Highlighter marks the target words. */
:root{
  --paper:#F2F4F0; --card:#FFFFFF; --ink:#16233F; --muted:#5B6578; --line:#D9DFD6; --soft:#E7ECF4;
  --hl:#FFE14D; --mark:rgba(255,222,64,.85); --go:#13795B; --go-bg:#DDF2E8; --no:#C23B2A; --no-bg:#FBE4E0; --navy:#22407A;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F131A; --card:#171D28; --ink:#E6EAF1; --muted:#97A1B2; --line:#283142; --soft:#1E2635;
  --hl:#E8C930; --mark:rgba(232,201,48,.32); --go:#41C08E; --go-bg:#15322A; --no:#F06A57; --no-bg:#3A1C19; --navy:#8FB0F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F131A; --card:#171D28; --ink:#E6EAF1; --muted:#97A1B2; --line:#283142; --soft:#1E2635;
  --hl:#E8C930; --mark:rgba(232,201,48,.32); --go:#41C08E; --go-bg:#15322A; --no:#F06A57; --no-bg:#3A1C19; --navy:#8FB0F0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.brand h1 b{background:linear-gradient(transparent 58%,var(--mark) 58%);font-weight:800}
.today{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline;margin-top:4px;font-size:14px}
.today .dt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.today .cd{font-weight:700}
.today .cd b{font-family:var(--f-display);font-size:20px;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 2px}
.sync{font-size:12px;color:var(--muted)}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.meter div{min-width:0}
.meter .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.meter .v{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--navy)}
.bar i.hl{background:var(--hl)}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav.tabs a{padding:8px 14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--hl)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
main{padding-top:20px;display:grid;gap:20px}
h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:700}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;font-weight:500}
button:hover{border-color:var(--navy)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
button.primary:hover{opacity:.9}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* plan */
.steps{list-style:none;margin:14px 0 18px;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--soft);border-radius:8px}
.steps .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-family:var(--f-mono)}
.steps li.ok .n{background:var(--go);border-color:var(--go);color:var(--card)}
.steps .t{min-width:0}
.steps .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.cal span{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted);position:relative}
.cal span.test{box-shadow:inset 0 0 0 2px var(--navy);color:var(--navy);font-weight:700}
.cal span.done{background:var(--go);color:var(--card)}
.cal span.done.test{box-shadow:none}
.cal span.cur{background:var(--hl);color:#16233F;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* stage */
.stage{display:grid;gap:16px}
.stagebar{display:flex;align-items:center;gap:12px}
.stagebar .bar{flex:1;height:8px}
.stagebar .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
.flash{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px;min-height:280px;display:grid;align-content:start;gap:14px}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.kk{font-family:var(--f-ipa);font-size:16px;color:var(--muted);white-space:nowrap}
.kk.lg{font-size:20px;color:var(--navy)}
.kk i{font-style:normal;font-family:var(--f-mono);font-size:11px;margin-right:2px}
.fam{font-size:14px;color:var(--ink);background:var(--soft);border-radius:6px;padding:6px 10px}
.fam i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--navy)}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--navy);border:1px solid var(--line);border-radius:4px;padding:1px 6px;vertical-align:middle}
.meaning{font-size:20px;font-weight:700}
.ex{font-size:16px;border-left:3px solid var(--hl);padding-left:12px}
.ex .zh{font-size:14px;color:var(--muted);margin-top:2px}
mark{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 1px;font-weight:700}
.say{border:none;background:var(--soft);border-radius:50%;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;vertical-align:middle;color:var(--ink)}
.say svg{width:16px;height:16px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{padding:12px 6px}
.rate .r0{border-color:var(--no);color:var(--no)}
.rate .r2{border-color:var(--go);color:var(--go)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted);margin-left:4px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 14px;display:flex;gap:10px;align-items:baseline}
.opts button .k{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opts button.right{background:var(--go-bg);border-color:var(--go)}
.opts button.wrong{background:var(--no-bg);border-color:var(--no)}
.q{font-size:18px}
.q .big{font-family:var(--f-display);font-size:30px;font-weight:800}
.fb{padding:12px 14px;border-radius:8px;font-size:14px}
.fb.ok{background:var(--go-bg)}
.fb.bad{background:var(--no-bg)}
input[type=text],input[type=date],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
/* dialogue */
.dlg{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.line .who{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:4px;background:var(--soft);white-space:nowrap}
.line.b .who{background:var(--ink);color:var(--paper)}
.line .txt{min-width:0}
.line .zh{font-size:13px;color:var(--muted)}
.chat{display:grid;gap:10px;max-height:420px;overflow-y:auto;padding:4px}
.bub{padding:10px 12px;border-radius:10px;max-width:88%;min-width:0}
.bub.me{justify-self:end;background:var(--ink);color:var(--paper)}
.bub.ai{background:var(--soft)}
.bub .note{font-size:13px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted)}
/* words list */
.wl{display:grid;gap:0}
.wl .it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.wl .it .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wl .it .w{font-weight:700;font-family:var(--f-display);font-size:17px}
.wl .it .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.wl .detail{grid-column:1/-1;font-size:14px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--go);border-color:var(--go)}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px}
a.btn{text-decoration:none;display:inline-block}
.rd-t{margin:8px 0 6px;font-size:22px}
.rd-teaser{font-size:16px;line-height:1.7}
.psg p{font-size:17px;line-height:1.8;margin:0 0 12px}
.psg p.zh{font-size:14px;color:var(--muted);line-height:1.7;margin-top:-6px}
.rl{display:grid}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}
.rw .w{font-family:var(--f-display);font-size:17px}
.rw .rt{display:flex;gap:6px;align-items:center}
.st{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);white-space:nowrap}
.st-master{background:var(--go-bg);color:var(--go)}
.st-learning{background:var(--mark)}
.rq{margin-top:12px}
.rq p{margin:0 0 8px}
.rq .fb{margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 12px;font-size:13px;border-radius:20px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.score{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--soft)}
.pill.go{background:var(--go-bg);color:var(--go)}
.pill.no{background:var(--no-bg);color:var(--no)}
.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14px;z-index:20}
.confirm{background:var(--no-bg);border-radius:8px;padding:12px}
@media (max-width:480px){.flash{padding:22px 16px}.meter .v{font-size:15px}.steps li{grid-template-columns:24px 1fr}.steps .m{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.flash,.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>

<header class="top"><div class="wrap" style="padding-bottom:0">
  <div class="brand"><h1>多益<b>千字</b> · 60 天</h1><span class="sync" id="sync">進度存在此瀏覽器</span></div>
  <div class="today" id="dateInfo"></div>
  <div class="meter">

    <div><div class="k">已學單字</div><div class="v" id="mLearn">0</div><div class="bar"><i id="bLearn" style="width:0"></i></div></div>

<script>

const W = RAW.map((r,i)=>{const [w,d,en,zh,kk,fm]=r;const p=(d.match(/^(n|v|adj|adv|prep)\./)||[,'n'])[1];return {i,w,d,en,zh,kk,p,fam:(fm||'').split(',').filter(Boolean).map(s=>s.split(':')),m:d.replace(/^(n|v|adj|adv|prep)\.\s*/,'')}});
const N = W.length, LESSONS = 48, DAYS = 60;
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/’/g,"'");
W.forEach(o=>{const base=norm(o.w);let stem=base.replace(/(e|y)$/,'');if(stem.length<3)stem=base;o.stem=stem;
  const toks=o.en.match(/[A-Za-zÀ-ÿ’'-]+/g)||[];o.tok=toks.find(t=>{const n=norm(t);return n.startsWith(stem)&&n.length<=base.length+4})||null;
  if(o.tok&&o.fam.length){const tk=norm(o.tok);const pool=o.fam.filter(x=>x[1]!==o.p).map(x=>x[0]).filter((x,k,a)=>norm(x)!==tk&&a.findIndex(y=>norm(y)===norm(x))===k);o.famPool=pool.length>=3?pool:null}});
const FAM=W.filter(o=>o.famPool).map(o=>o.i);
const POSZH={n:'名詞',v:'動詞',adj:'形容詞',adv:'副詞'};
function famHTML(o){if(!o.fam.length)return '';return `<div class="fam"><span class="eyebrow">詞性家族</span> <b>${esc(o.w)}</b> <i>${o.p}.</i>${o.fam.map(([x,p])=>` · ${esc(x)} <i>${p}.</i>`).join('')}</div>`}
const lessonRange = L => [Math.round(L*N/LESSONS), Math.round((L+1)*N/LESSONS)];
const lessonOf = i => {for(let L=0;L<LESSONS;L++){if(i<lessonRange(L)[1])return L}return LESSONS-1};
const lessonWords = L => {const [a,b]=lessonRange(L);const out=[];for(let i=a;i<b;i++)out.push(i);return out};
function dayInfo(d){
  if(d<=56){const wk=Math.floor((d-1)/7);if(d%7===0)return {type:'test',week:wk+1};return {type:'learn',lesson:wk*6+(d%7)-1,week:wk+1}}
  if(d<=59)return {type:'sprint'}; if(d===60)return {type:'final'}; return {type:'keep'};
}
const INTERVAL=[1,2,4,8,16,32];
function kkHTML(o,lg){if(!o.kk)return '';const parts=o.kk.split(' / ').map(s=>{const m=s.match(/^([a-z./]+.) (.+)$/);return m?`<i>${esc(m[1])}</i>[${esc(m[2])}]`:`[${esc(s)}]`});return `<span class="kk${lg?' lg':''}" lang="en-fonipa">${parts.join(' ')}</span>`}
/* ---------- dates ---------- */
const iso = (dt=new Date()) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const parse = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays = (s,n) => {const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const today = () => iso();
/* ---------- state ---------- */
const LS='toeic1000.v1';
let S = blank();
function blank(){return {v:1,start:null,day:1,w:{},log:{},tests:[],partial:null,updatedAt:0}}
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.v===1)S=s}catch(e){}
const ws = i => {const v=S.w[i];if(!v)return null;const [b,due]=v.split(':');return {box:+b,due}};
const setW = (i,box,due) => {S.w[i]=box+':'+due};
let saveT=null;
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(pushCloud,900);paintMeter()}
/* ---------- cloud (claude db) ---------- */
let cloud=null, uid=null, writing=false, again=false, sampleFn=null;
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    claude.use('sample').then(s=>{sampleFn=s;if(view==='today')render()}).catch(()=>{});
    if(!db||!user)return; uid=await user.id(); if(!uid)return;
    cloud=db.doc(`data/users/${uid}/state`);
    const snap=await cloud.get();
    if(snap.exists){const s=snap.data();if(s&&s.v===1&&(s.updatedAt||0)>(S.updatedAt||0)){S=s;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){};paintMeter();if(!inSession)render()}
      else if((S.updatedAt||0)>(s.updatedAt||0))pushCloud();}
    else if(S.start)pushCloud();
    setSync('已同步到你的 Claude 帳號');
  }catch(e){setSync('雲端同步無法使用，進度存在此瀏覽器')}
}
async function pushCloud(){
  if(!cloud)return; if(writing){again=true;return}
  writing=true;
  try{await cloud.set(JSON.parse(JSON.stringify(S)));setSync('已同步到你的 Claude 帳號')}catch(e){setSync('同步失敗，進度先存在此瀏覽器')}
  writing=false; if(again){again=false;pushCloud()}
}
const setSync = t => {document.getElementById('sync').textContent=t};
async function dlgGet(key){try{const v=localStorage.getItem('toeic1000.dlg.'+key);if(v)return JSON.parse(v)}catch(e){}
  if(cloud&&uid){try{const s=await (await claude.use('db')).doc(`data/users/${uid}/dlg-${key}`).get();if(s.exists)return s.data()}catch(e){}}return null}
async function dlgPut(key,val){try{localStorage.setItem('toeic1000.dlg.'+key,JSON.stringify(val))}catch(e){}
  if(cloud&&uid){try{await (await claude.use('db')).doc(`data/users/${uid}/dlg-${key}`).set(val)}catch(e){}}}
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = (a,n) => shuffle(a).slice(0,n);
const canSay = 'speechSynthesis' in window;
function say(t){if(!canSay)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
const SAY_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = t => canSay?`<button class="say" data-say="${esc(t)}" aria-label="朗讀">${SAY_SVG}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();say(b.dataset.say)}});
function hlSentence(en,idxs){let h=esc(en);const stems=idxs.map(i=>W[i].stem).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!stems.length)return h;const re=new RegExp(`\\b(${stems.map(s=>s.replace(/[^a-z'-]/g,'')).filter(Boolean).join('|')})[a-zà-ÿ]*`,'gi');return h.replace(re,m=>`<mark>${m}</mark>`)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const learnedIdx = () => Object.keys(S.w).map(Number);
const masteredCount = () => Object.values(S.w).filter(v=>+v.split(':')[0]>=4).length;
function calDay(){return S.start?diffDays(S.start,today())+1:1}
function paintDate(){const el=document.getElementById('dateInfo');if(!el)return;const t=today(),d=parse(t);const wd='日一二三四五六'[d.getDay()];
  let cd='<span class="muted">尚未開始計畫</span>';
  if(S.start){const end=addDays(S.start,59),left=diffDays(t,end),cal=calDay();
    const practiced=new Set(Object.values(S.log).map(x=>x.date)).size;
    const pr=`<span class="cd">已練習 <b>${practiced}</b> 天</span>`;
    if(cal>=1)cd=pr;
    if(cal<1)cd=`<span class="cd">距離開始還有 <b>${1-cal}</b> 天</span>`;
    else if(left>0)cd+=`<span class="cd">倒數 <b>${left}</b> 天</span><span class="muted small">預計 ${end.replace(/-/g,'/')} 完成 · 今天是日曆上第 ${cal} 天</span>`;
    else if(left===0)cd+=`<span class="cd">今天是第 60 天，最後一天</span>`;
    else cd+=`<span class="cd">60 天計畫已到期</span><span class="muted small">${S.day>60?'進度全部完成':`還有 ${61-S.day} 天的進度沒做完`}</span>`;}
  el.innerHTML=`<span class="dt">${t.replace(/-/g,'/')}（${wd}）</span>${cd}`}
function paintMeter(){paintDate();const d=Math.min(S.day-1,60),l=learnedIdx().length,m=masteredCount();
  $('#mDay').textContent=`${d} / 60`;$('#bDay').style.width=(d/60*100)+'%';
  $('#mLearn').textContent=`${l} / ${N}`;$('#bLearn').style.width=(l/N*100)+'%';
  $('#mMaster').textContent=`${m}`;$('#bMaster').style.width=(m/N*100)+'%';}
function dueList(cap){const t=today();return learnedIdx().map(i=>({i,...ws(i)})).filter(o=>o.due<=t).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:a.box-b.box).slice(0,cap).map(o=>o.i)}
function grade(i,q){/* q:0 forgot,1 fuzzy,2 knew */const cur=ws(i)||{box:0};let box=cur.box;
  if(q===0)box=0;else if(q===2)box=Math.min(5,box+1);
  const iv=q===1?Math.max(1,Math.ceil(INTERVAL[box]/2)):INTERVAL[box];setW(i,box,addDays(today(),iv));}
/* ---------- plan ---------- */
function weekWords(week){let a=[];for(let L=(week-1)*6;L<week*6;L++)a=a.concat(lessonWords(L));return a}
function planFor(d){
  const info=dayInfo(d);const steps=[];
  if(info.type==='learn'){const nw=lessonWords(info.lesson);const due=dueList(100);
    if(due.length)steps.push({id:'review',name:'複習舊字',desc:`${due.length} 個到期的字`,min:Math.ceil(due.length*4/60),list:due});
    steps.push({id:'learn',name:'學新字',desc:`第 ${info.lesson+1} 課 · ${nw.length} 個新字`,min:Math.ceil(nw.length*22/60),list:nw});
    steps.push({id:'check',name:'新字小測',desc:'答錯的字會重出到答對為止',min:2,list:nw});
    {const fe=nw.filter(i=>W[i].famPool);const extra=pick(learnedIdx().filter(i=>W[i].famPool&&!nw.includes(i)),Math.max(0,6-fe.length));const fl=pick(fe,6).concat(extra);
     if(fl.length)steps.push({id:'family',name:'詞性變化',desc:`多益 Part 5 題型 · ${fl.length} 題`,min:2,list:fl});}
    steps.push({id:'talk',name:'今日會話',desc:'用今天的字讀例句對話，跟著唸一遍',min:2,list:nw});}
  else if(info.type==='test'){const due=dueList(100);const wk=weekWords(info.week);const prev=learnedIdx().filter(i=>!wk.includes(i));
    if(due.length)steps.push({id:'review',name:'複習舊字',desc:`${due.length} 個到期的字`,min:Math.ceil(due.length*4/60),list:due});
    const qs=pick(wk,prev.length?25:40).concat(pick(prev,15));
    steps.push({id:'exam',name:`第 ${info.week} 週考`,desc:prev.length?`${qs.length} 題 · 本週 25 題＋前幾週抽 15 題`:`${qs.length} 題 · 本週的字`,min:Math.ceil(qs.length*12/60),list:qs,kind:'week',label:`第 ${info.week} 週考`});}
  else if(info.type==='sprint'){const due=dueList(120);const weak=learnedIdx().map(i=>({i,...ws(i)})).sort((a,b)=>a.box-b.box).slice(0,30).map(o=>o.i);
    if(due.length)steps.push({id:'review',name:'衝刺複習',desc:`${due.length} 個到期的字`,min:Math.ceil(due.length*4/60),list:due});
    steps.push({id:'drill',name:'弱點加強',desc:`熟悉度最低的 ${weak.length} 個字`,min:4,list:weak});
    steps.push({id:'talk',name:'弱字會話',desc:'用弱點字讀一段對話',min:3,list:weak.slice(0,12)});}
  else if(info.type==='final'){const qs=[];for(let L=0;L<LESSONS;L++)qs.push(...pick(lessonWords(L),2));qs.push(...pick(learnedIdx().filter(i=>!qs.includes(i)),4));
    steps.push({id:'exam',name:'期末總測驗',desc:`${qs.length} 題，從 1000 字平均抽出`,min:18,list:qs.slice(0,100),kind:'final',label:'期末總測驗'});}
  else {const due=dueList(100);if(due.length)steps.push({id:'review',name:'維持複習',desc:`${due.length} 個到期的字`,min:Math.ceil(due.length*4/60),list:due});
    const r=pick(learnedIdx(),10);steps.push({id:'talk',name:'隨機會話',desc:'10 個隨機舊字組成的對話',min:3,list:r});}
  return {d,info,steps};
}
/* ---------- 每日閱讀 ---------- */
let NEWS=null, PASS=null, rdNews=0, rdLesson=null, rdZh=false;
const STZH={new:'未學',learning:'學習中',master:'熟記'};
let WMAP=null;
function wordMap(){if(WMAP)return WMAP;WMAP=new Map();
  const vars=w=>{const v=[w,w+'s',w+'es',w+'ed',w+'d',w+'ing',w+"'s"];if(w.endsWith('e'))v.push(w.slice(0,-1)+'ing');if(/[^aeiou]y$/.test(w))v.push(w.slice(0,-1)+'ies',w.slice(0,-1)+'ied');if(/[^aeiou][aeiou][bdgmnprt]$/.test(w)){const c=w.slice(-1);v.push(w+c+'ed',w+c+'ing')}return v};
  W.forEach(o=>vars(o.w.toLowerCase()).forEach(f=>{if(!WMAP.has(f))WMAP.set(f,o.i)}));
  W.forEach(o=>o.fam.forEach(([x])=>[x,x+'s'].forEach(f=>{if(!WMAP.has(f))WMAP.set(f,o.i)})));return WMAP}
function curLesson(){if(!S.start)return 0;for(let d=Math.min(S.day,56);d>=1;d--){const t=dayInfo(d);if(t.type==='learn')return t.lesson}return S.day>56?LESSONS-1:0}
function sayAll(t){if(!canSay)return;try{speechSynthesis.cancel();(t.match(/[^.!?\n]+[.!?]*/g)||[t]).map(s=>s.trim()).filter(Boolean).forEach(s=>{const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)})}catch(e){}}
function wordRow(i,form){const o=W[i],st=status(i);
  return `<div class="rw"><div><b class="w">${esc(o.w)}</b>${form&&form!==o.w.toLowerCase()?` <span class="small muted">文中：${esc(form)}</span>`:''} ${kkHTML(o)}<div class="small">${esc(o.d)}</div></div><div class="rt"><span class="st st-${st}">${STZH[st]}</span>${sayBtn(o.w)}</div></div>`}
function markPassage(text,set){return esc(text).replace(/[A-Za-zé][A-Za-zé'-]*/g,t=>{const i=wordMap().get(t.toLowerCase());return i!==undefined&&set.has(i)?`<mark>${t}</mark>`:t})}
async function loadRead(){const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()});
  if(!NEWS)NEWS=await get('data/news.json').catch(()=>[]);
  if(!PASS)PASS=await get('data/passages.json').catch(()=>[]);}
async function vRead(m){m.innerHTML=`<section class="card"><p class="muted">載入中…</p></section>`;await loadRead();if(view!=='read')return;
  if(rdLesson===null)rdLesson=curLesson();
  const n=NEWS[rdNews];
  const newsHTML=!n?`<section class="card"><div class="eyebrow">每日新聞</div><p class="muted">今天的新聞還沒更新，晚點再來看看。</p></section>`:
  `<section class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">每日新聞 · ${esc(n.source)} · Level ${n.level}</div>
   ${NEWS.length>1?`<select id="rdN" aria-label="選擇日期" style="width:auto">${NEWS.map((x,k)=>`<option value="${k}"${k===rdNews?' selected':''}>${x.date.replace(/-/g,'/')}${k===0?'（最新）':''}</option>`).join('')}</select>`:''}</div>
   <h2 class="rd-t">${esc(n.title.replace(/\s*[–-]\s*level \d\s*$/i,''))}</h2>
   <p class="rd-teaser">${esc(n.teaser)}</p>
   <div class="row"><a class="btn" href="${esc(n.link)}" target="_blank" rel="noopener">到原網站讀全文 ↗</a><span class="small muted">原文版權屬 ${esc(n.source)}，這裡只放摘要與單字。</span></div>
   <h3 style="margin-top:18px">文中的多益單字 <span class="small muted">${n.words.length} 個</span></h3>
   ${n.words.length?`<p class="small muted" style="margin:0 0 6px">先看單字，再去讀原文，讀到時特別注意它們的用法。</p><div class="rl">${n.words.slice().sort((a,b)=>({learning:0,master:1,new:2}[status(a[0])])-({learning:0,master:1,new:2}[status(b[0])])).map(([i,f])=>wordRow(i,f)).join('')}</div>`:'<p class="muted">這篇沒有出現單字表裡的字。</p>'}</section>`;
  const p=PASS[rdLesson];let passHTML='';
  if(p){const lw=new Set(lessonWords(rdLesson));const found=[];const seen=new Set();
    for(const t of p.en.match(/[A-Za-zé][A-Za-zé'-]*/g)||[]){const i=wordMap().get(t.toLowerCase());if(i!==undefined&&lw.has(i)&&!seen.has(i)){seen.add(i);found.push([i,t.toLowerCase()])}}
    const enP=p.en.split('\n\n'),zhP=p.zh.split('\n\n');
    passHTML=`<section class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">多益短文 · ${esc(p.g)}</div>
    <select id="rdL" aria-label="選擇課次" style="width:auto">${PASS.map((_,L)=>`<option value="${L}"${L===rdLesson?' selected':''}>第 ${L+1} 課${L===curLesson()&&S.start?'（目前）':''}</option>`).join('')}</select></div>
    <h2 class="rd-t">${esc(p.t)}</h2>
    <p class="small muted">用第 ${rdLesson+1} 課的單字寫成，標黃的是這課的字（${found.length} 個）。</p>
    <div class="row" style="margin-bottom:10px">${canSay?`<button id="rdSay">朗讀全文</button><button id="rdStop">停止</button>`:''}<button id="rdZh" aria-pressed="${rdZh}">${rdZh?'隱藏':'顯示'}中文翻譯</button></div>
    <div class="psg">${enP.map((x,k)=>`<p>${markPassage(x,lw).replace(/\n/g,'<br>')}</p>${rdZh&&zhP[k]?`<p class="zh">${esc(zhP[k]).replace(/\n/g,'<br>')}</p>`:''}`).join('')}</div>
    <h3 style="margin-top:18px">閱讀測驗</h3>
    ${p.q.map((q,k)=>`<div class="rq" data-k="${k}"><p><b>${k+1}.</b> ${esc(q[0])}</p><div class="opts">${q[1].map((o,j)=>`<button data-j="${j}"><span class="k">${'ABCD'[j]}</span>${esc(o)}</button>`).join('')}</div><div class="fb" hidden></div></div>`).join('')}
    <h3 style="margin-top:18px">本課重點單字</h3><div class="rl">${found.map(([i,f])=>wordRow(i,f)).join('')}</div></section>`}
  m.innerHTML=newsHTML+passHTML;
  const rn=$('#rdN');if(rn)rn.onchange=()=>{rdNews=+rn.value;vRead(m)};
  const rl=$('#rdL');if(rl)rl.onchange=()=>{rdLesson=+rl.value;vRead(m)};
  const rz=$('#rdZh');if(rz)rz.onclick=()=>{rdZh=!rdZh;vRead(m)};
  const rs=$('#rdSay');if(rs)rs.onclick=()=>sayAll(p.en);
  const rx=$('#rdStop');if(rx)rx.onclick=()=>{try{speechSynthesis.cancel()}catch(e){}};
  m.querySelectorAll('.rq').forEach(box=>{const q=p.q[+box.dataset.k];box.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(box.dataset.done)return;box.dataset.done=1;const j=+b.dataset.j;
    box.querySelectorAll('.opts button').forEach(x=>{if(+x.dataset.j===q[2])x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    const fb=box.querySelector('.fb');fb.hidden=false;fb.style.background=j===q[2]?'var(--go-bg)':'var(--no-bg)';fb.innerHTML=`<b>${j===q[2]?'答對了':'正確答案是 '+'ABCD'[q[2]]}</b>　${esc(q[3])}`})});
}

/* ---------- views ---------- */
let view='today', inSession=false, todayPlan=null;
function route(){const h=(location.hash||'#today').slice(1);view=['today','read','words','tests','about'].includes(h)?h:'today';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===view?'page':'false'));if(!inSession)render()}
window.addEventListener('hashchange',()=>{if(inSession){inSession=false;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}route()});
function render(){paintMeter();const m=$('#main');
  if(view==='today')m.innerHTML=S.start?vToday():vWelcome();
  else if(view==='read')vRead(m);
  else if(view==='words')vWords(m);
  else if(view==='tests')m.innerHTML=vTests();

function calHTML(){let h='<div class="cal" aria-label="60 天進度">';for(let d=1;d<=60;d++){const t=dayInfo(d).type;const c=[(t==='test'||t==='final')?'test':'',d<S.day?'done':'',d===S.day?'cur':''].join(' ');h+=`<span class="${c}" title="第 ${d} 天">${d}</span>`}
  return h+'</div><div class="legend"><span><i style="background:var(--go)"></i>已完成</span><span><i style="background:var(--hl)"></i>下一天</span><span><i style="box-shadow:inset 0 0 0 2px var(--navy)"></i>週考／期末考</span></div>'}
function vWelcome(){const ex=W[8];return `
<section class="card"><div class="eyebrow">開始之前</div><h2 style="margin-top:6px">60 天背完多益 1000 字，每天 10–15 分鐘</h2>

<section class="card"><div class="eyebrow">單字卡長這樣</div>

<div class="meaning" style="margin:8px 0">${esc(ex.m)}</div><div class="ex">${hlSentence(ex.en,[ex.i])}<div class="zh">${esc(ex.zh)}</div></div></section>
<section class="card"><h3>60 天地圖</h3>${calHTML()}</section>`}
function vToday(){
  const cd=calDay();const info=dayInfo(S.day);todayPlan=planFor(S.day);
  const doneToday=Object.values(S.log).some(x=>x.date===today())&&S.day>cd;
  const behind=cd-S.day;const part=S.partial&&S.partial.day===S.day?S.partial.done:[];
  const typeName={learn:`學習日 · 第 ${info.week} 週`,test:`週考日 · 第 ${info.week} 週`,sprint:'衝刺複習',final:'期末考日',keep:'維持記憶'}[info.type];
  const mins=todayPlan.steps.reduce((a,s)=>a+s.min,0);
  let head='';
  if(doneToday)head=`<div class="fb ok">今天的進度完成了。明天會有新的字和到期的複習。</div>`;
  else if(behind>0)head=`<div class="fb bad">比原訂計畫慢了 ${behind} 天。照順序補上就好，一次做一天。</div>`;
  const steps=todayPlan.steps.map((s,k)=>`<li class="${part.includes(s.id)?'ok':''}"><span class="n">${part.includes(s.id)?'✓':k+1}</span><span class="t"><b>${s.name}</b><br><span class="small muted">${s.desc}</span></span><span class="m">約 ${s.min} 分</span></li>`).join('');

  const st=stage(label,total,total);
  st.innerHTML=`<div class="flash"><div class="eyebrow">${esc(label)} 成績</div><div class="row" style="align-items:flex-end"><span class="score">${pct}</span><span class="muted">分 · 答對 ${ok} / ${total}</span>
  <span class="pill ${pct>=80?'go':'no'}">${pct>=80?'達到 80 分目標':'未達 80 分，錯字已排進複習'}</span></div>
  ${wrong.length?`<h3>答錯的字</h3><div class="wl">${wrong.map(i=>`<div class="it" style="cursor:default"><span class="no">${i+1}</span><span style="min-width:0"><span class="w">${esc(W[i].w)}</span> ${kkHTML(W[i])} <span class="d">${esc(W[i].d)}</span></span>${sayBtn(W[i].w)}</div>`).join('')}</div>`:'<p>全部答對。</p>'}</div>
  <div class="row end"><button class="primary" id="nx">繼續<kbd>Enter</kbd></button></div>`;
  $('#nx').onclick=()=>{keyH=null;res()};keyH=e=>{if(e.key==='Enter'){e.preventDefault();$('#nx').click()}};})}
function testGrade(i,ok){if(ok){const s=ws(i);if(s)setW(i,Math.min(5,s.box+1),addDays(today(),INTERVAL[Math.min(5,s.box+1)]));else setW(i,1,addDays(today(),1))}else setW(i,0,addDays(today(),1));save()}
/* dialogue */
function talkPrompt(words){return `You are writing study material for a Taiwanese adult preparing for the TOEIC exam.
Write ONE natural dialogue (8 to 10 lines, two speakers with English first names) set in a realistic TOEIC situation (office, travel, shopping, clinic, hotel, meetings, etc.).
Use as many of these target words as sound natural (at least 8), in correct grammatical form: ${words.map(i=>W[i].w).join(', ')}.
Keep sentences at TOEIC level (CEFR B1-B2), 8-20 words each.
Reply ONLY with JSON: {"title":"short English title","scene_zh":"一句繁體中文情境說明","lines":[{"s":"speaker name","en":"English line","zh":"繁體中文翻譯（台灣用語）"}]}`}
function fallbackDlg(words){const ws_=words.slice(0,10);return {title:'Example sentences',scene_zh:'目前無法產生新對話，先用今天的例句輪流朗讀。',fallback:true,
  lines:ws_.map((i,k)=>({s:k%2?'B':'A',en:W[i].en,zh:W[i].zh}))}}
function runTalk(words,key){return new Promise(async res=>{const st=stage('今日會話',0,0);keyH=null;let showZh=false;let d=await dlgGet(key);
  const drawDlg=()=>{if(!inSession)return;const speakers=[...new Set(d.lines.map(l=>l.s))];
    st.innerHTML=`<div class="flash"><div class="spread"><div><div class="eyebrow">今日會話</div><h2>${esc(d.title)}</h2><div class="small muted">${esc(d.scene_zh||'')}</div></div>
      <div class="row">${canSay?`<button id="playAll">全部朗讀</button>`:''}<button id="tz">${showZh?'隱藏中文':'顯示中文'}</button></div></div>
      <p class="small muted">先只看英文讀一遍，猜不出來再打開中文。螢光筆標的是今天的字。</p>
      <div class="dlg">${d.lines.map(l=>`<div class="line ${speakers.indexOf(l.s)%2?'b':''}"><span class="who">${esc(l.s)}</span><div class="txt">${hlSentence(l.en,words)}${showZh?`<div class="zh">${esc(l.zh)}</div>`:''}</div>${sayBtn(l.en)}</div>`).join('')}</div>
      ${sampleFn&&d.fallback?`<button id="gen">改用 Claude 產生對話</button>`:''}</div>
      ${sampleFn?`<section class="card"><h3>和 Claude 對練</h3><p class="small muted">Claude 扮演對話裡的另一方，你用英文回答，盡量用到今天的字。它會用中文簡短指正。</p>
        <div class="chat" id="chat"></div><form id="cf" class="row" style="margin-top:8px"><input type="text" id="ci" placeholder="用英文回覆…" autocomplete="off" style="flex:1;min-width:0" aria-label="英文回覆"><button class="primary" id="cs">送出</button></form>
        <div class="row" style="margin-top:6px"><button id="rp" class="ghost">開始對練</button></div></section>`:''}
      <div class="row end"><button class="primary" id="done">完成會話</button></div>`;
    $('#tz').onclick=()=>{showZh=!showZh;drawDlg()};$('#done').onclick=()=>res();
    const pa=$('#playAll');if(pa)pa.onclick=()=>{try{speechSynthesis.cancel();d.lines.forEach((l,n)=>{const u=new SpeechSynthesisUtterance(l.en);u.lang='en-US';u.rate=.92;u.pitch=speakers.indexOf(l.s)%2?.8:1.15;speechSynthesis.speak(u)})}catch(e){}};
    const gb=$('#gen');if(gb)gb.onclick=()=>gen();
    if(sampleFn)bindChat(words,d);};
  const gen=async()=>{st.innerHTML=`<div class="flash"><div class="eyebrow">今日會話</div><p>Claude 正在用今天的字寫一段對話…</p></div>`;
    try{const r=await sampleFn.json(talkPrompt(words),{modelTier:'default'});if(!r||!Array.isArray(r.lines)||!r.lines.length)throw new Error('bad');d={title:String(r.title||'Dialogue'),scene_zh:String(r.scene_zh||''),lines:r.lines.slice(0,14).map(l=>({s:String(l.s||'A'),en:String(l.en||''),zh:String(l.zh||'')}))};await dlgPut(key,d)}
    catch(e){d=fallbackDlg(words);d.err=(e&&e.code==='not_granted')?'你沒有允許這個頁面使用 Claude，先用例句代替。':'這次沒產生成功，先用例句代替。可以稍後再按「改用 Claude 產生對話」。';d.scene_zh=d.err}
    drawDlg()};
  if(d)drawDlg();
  else if(sampleFn){st.innerHTML=`<div class="flash"><div class="eyebrow">今日會話</div><h2>用今天的字產生一段對話</h2><p class="muted">Claude 會用今天的字寫一段多益常見情境的對話，附中文翻譯。第一次使用會詢問你是否允許。</p>
      <div class="row"><button class="primary" id="gen1">產生對話</button><button id="skip1">只看例句</button></div></div>`;
    $('#gen1').onclick=gen;$('#skip1').onclick=()=>{d=fallbackDlg(words);drawDlg()}}
  else{d=fallbackDlg(words);drawDlg()}})}
function bindChat(words,d){const chat=$('#chat'),hist=[];let busy=false;
  const sys=`Role-play practice for a Taiwanese TOEIC learner. Scene: "${d.title}" — ${d.scene_zh}. You play one character in this scene; the learner plays the other.
Keep your lines short (1-2 sentences, B1-B2 level) and try to use these target words: ${words.map(i=>W[i].w).join(', ')}.
Reply ONLY with JSON: {"reply":"your next English line","fix":"a corrected, natural version of the learner's last sentence, or empty string if it was already fine","note_zh":"一句繁體中文的簡短說明（文法或用字），沒有錯就鼓勵一句"}`;
  const add=(cls,html)=>{const b=document.createElement('div');b.className='bub '+cls;b.innerHTML=html;chat.appendChild(b);chat.scrollTop=chat.scrollHeight;return b};
  const ask=async(userText)=>{if(busy)return;busy=true;$('#cs').disabled=true;const wait=add('ai','<span class="muted">…</span>');
    const msgs=[{role:'user',content:sys+(hist.length?'':'\n\nStart the conversation with your first line. Leave "fix" empty.')}];
    hist.forEach(h=>msgs.push(h));if(userText)msgs.push({role:'user',content:userText});
    try{const r=await sampleFn.json(msgs,{modelTier:'quick',cache:false});const reply=String(r.reply||'');
      if(userText)hist.push({role:'user',content:userText});hist.push({role:'assistant',content:JSON.stringify(r)});
      wait.innerHTML=`${hlSentence(reply,words)} ${sayBtn(reply)}${userText&&(r.fix||r.note_zh)?`<div class="note">${r.fix?`建議說法：<b>${esc(r.fix)}</b><br>`:''}${esc(r.note_zh||'')}</div>`:''}`;say(reply)}
    catch(e){wait.innerHTML=`<span class="muted">${e&&e.code==='rate_limited'?'用量暫時到上限，晚點再試。':e&&e.code==='not_granted'?'沒有取得使用 Claude 的允許。':'這次沒有回應，再送一次試試。'}</span>`}
    busy=false;$('#cs').disabled=false};
  $('#rp').onclick=()=>{if(!hist.length&&!busy){$('#rp').hidden=true;ask(null)}};
  $('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v||busy)return;$('#ci').value='';$('#rp').hidden=true;add('me',esc(v));ask(v)};}
/* ---------- flows ---------- */
async function runDay(){inSession=true;sessStart=Date.now();const plan=planFor(S.day);const d=S.day;
  if(!S.partial||S.partial.day!==d)S.partial={day:d,done:[]};
  for(const s of plan.steps){if(!inSession)return;if(S.partial.done.includes(s.id))continue;
    if(s.id==='review')await runReview(s.list,s.name);
    else if(s.id==='learn')await runLearn(s.list);
    else if(s.id==='check'){const rs=await runQuiz(shuffle(s.list).map(i=>makeQ(i,Math.random()<.6?'zh':'en')),{title:'新字小測',retryWrong:true});
      if(!inSession)return;rs.forEach(r=>setW(r.i,r.ok?1:0,addDays(today(),r.ok?INTERVAL[1]:1)));save()}
    else if(s.id==='drill'){const rs=await runQuiz(s.list.map(i=>makeQ(i)),{title:'弱點加強',retryWrong:true,onAnswer:testGrade});if(!inSession)return}
    else if(s.id==='exam'){const rs=await runQuiz(shuffle(s.list).map(i=>makeQ(i)),{title:s.label,onAnswer:testGrade});if(!inSession)return;
      await showResult(s.label,rs,s.kind,plan.info.week?{week:plan.info.week}:{})}
    else if(s.id==='family'){await runQuiz(shuffle(s.list).map(i=>makeQ(i,'fam')),{title:'詞性變化'});if(!inSession)return}
    else if(s.id==='talk')await runTalk(s.list,'d'+d);
    if(!inSession)return;S.partial.done.push(s.id);save()}
  if(!inSession)return;
  S.log['d'+d]={date:today(),sec:Math.round((Date.now()-sessStart)/1000)};S.day=d+1;S.partial=null;save();inSession=false;keyH=null;
  const st=$('#main');st.innerHTML=`<section class="card"><div class="eyebrow">第 ${d} 天完成</div><h2 style="margin-top:6px">今天的份量完成了</h2>
  <p class="muted">已學 ${learnedIdx().length} 字，熟記 ${masteredCount()} 字。明天會出現新字和到期的複習。</p><div class="row"><button class="primary" id="home">回到今日</button></div></section>`;
  $('#home').onclick=()=>render();paintMeter()}
async function runExtra(){inSession=true;await runReview(dueList(30),'加碼複習');if(!inSession)return;inSession=false;toast('複習完成');render()}
async function runQuick(){const pool=learnedIdx();const src=pool.length>=20?pool:pool.concat(lessonWords(Math.min(LESSONS-1,Math.max(0,dayInfo(S.day).lesson||0))));
  inSession=true;const qs=pick([...new Set(src)],20).map(i=>makeQ(i));const learnedSet=new Set(pool);
  const rs=await runQuiz(qs,{title:'隨堂小考',onAnswer:(i,ok)=>{if(learnedSet.has(i))testGrade(i,ok)}});if(!inSession)return;
  await showResult('隨堂小考',rs,'quick');inSession=false;render()}
async function runFam(){const learned=learnedIdx().filter(i=>W[i].famPool);const src=learned.length>=20?learned:learned.concat(FAM.filter(i=>!learned.includes(i)).slice(0,40));
  inSession=true;const rs=await runQuiz(pick(src,20).map(i=>makeQ(i,'fam')),{title:'詞性變化練習'});if(!inSession)return;
  await showResult('詞性變化練習',rs,'fam');inSession=false;render()}
/* ---------- boot ---------- */
route();initCloud();
</script>
